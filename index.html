<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>*{box-sizing:border-box}html,body{margin:0}</style></head><body>
<title>Приглашение на свадьбу</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Marck+Script&family=Great+Vibes&display=swap" media="print" onload="this.media='all'"><noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Marck+Script&family=Great+Vibes&display=swap"></noscript>
<style>
  :root {
    color-scheme: dark;
    --wine: #3E1115; --wine-d: #2A0A0D; --wine-l: #4C181C; --cream: #F4E8D6; --gold: #D9B567; --ink: #1F0608;
    --f-serif: 'Cormorant Garamond', 'Times New Roman', serif; --f-script: 'Great Vibes', 'Allegretto Script', 'Marck Script', 'Segoe Script', cursive;
    --noise: url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22240%22 height=%22240%22%3E%3Cfilter id=%22n%22%3E%3CfeTurbulence type=%22fractalNoise%22 baseFrequency=%22.85%22 numOctaves=%222%22 stitchTiles=%22stitch%22/%3E%3CfeColorMatrix values=%220 0 0 0 .6  0 0 0 0 .3  0 0 0 0 .25  0 0 0 .09 0%22/%3E%3C/filter%3E%3Crect width=%22240%22 height=%22240%22 filter=%22url%28%23n%29%22/%3E%3C/svg%3E");
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--wine-d); color: var(--cream); font-family: var(--f-serif); overflow-x: hidden; }
  html.locked, html.locked body { overflow: hidden; }
  button { font: inherit; color: inherit; }

  /* ---- язык ---- */
  .lang { position: fixed; z-index: 120; top: calc(12px + env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); display: flex; gap: 12px; padding: 3px 11px; font: 500 12px/1.6 var(--f-serif); letter-spacing: .26em; background: rgba(20, 5, 7, .45); border: 1px solid rgba(217, 181, 103, .35); }
  .lang button { background: none; border: 0; padding: 3px 0; cursor: pointer; opacity: .6; border-bottom: 1px solid transparent; letter-spacing: inherit; }
  .lang button[aria-pressed="true"] { opacity: 1; border-bottom-color: var(--gold); }

  /* ---- сцена с конвертом ---- */
  .stage { position: fixed; inset: 0; z-index: 100; container-type: size; background: var(--wine); transition: opacity .5s ease; overflow: hidden; }
  .stage.half { background: var(--wine); will-change: transform, opacity; }
  .stage.go:not(.hs) .seal, .stage.go .ttl, .stage.go .hint, .stage.go .orn, .stage.go .lang { animation: none !important; opacity: 0 !important; transition: opacity .25s ease; pointer-events: none; }
  .stage.hb { clip-path: polygon(0 100%, 100% 100%, 100% 76%, 50% 57%, 0 76%); }
  .stage.ht { clip-path: polygon(0 0, 100% 0, 100% 38%, 50% 57%, 0 38%); }
  .stage.hl { clip-path: polygon(0 38%, 50% 57%, 0 76%); }
  .stage.hr { clip-path: polygon(100% 38%, 50% 57%, 100% 76%); }
  .stage.hs { background: transparent; }
  .stage.hs .seal { animation: none !important; opacity: 1; transform: none; }
  .stage.ht.go { animation: flapT 2s cubic-bezier(.45, 0, .25, 1) .45s forwards; }
  .stage.hb.go { animation: flapB 2s cubic-bezier(.45, 0, .25, 1) .45s forwards; }
  .stage.hl.go, .stage.hr.go { animation: pcf .8s ease forwards; }
  .stage.hs.go { animation: sealf .9s ease .1s forwards; }
  @keyframes flapT { 0% { clip-path: polygon(0 0, 100% 0, 100% 38%, 50% 57%, 0 38%); opacity: 1; } 70% { opacity: .9; } 100% { clip-path: polygon(0 0, 100% 0, 100% 38%, 50% 36%, 0 38%); opacity: 0; } }
  @keyframes flapB { 0% { clip-path: polygon(0 100%, 100% 100%, 100% 76%, 50% 57%, 0 76%); opacity: 1; } 70% { opacity: .9; } 100% { clip-path: polygon(0 100%, 100% 100%, 100% 76%, 50% 78%, 0 76%); opacity: 0; } }
  @keyframes pcf { 0% { opacity: 1; } 35% { opacity: .5; } 100% { opacity: 0; } }
  @keyframes sealf { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: scale(1.06); } }
  .stage.leave { opacity: 0; pointer-events: none; }
  .env { --u: min(1cqw, .62cqh); position: absolute; inset: 0; perspective: 1800px; transition: transform .7s cubic-bezier(.6, 0, .2, 1); animation: envIn .9s ease; }
  .stage.leave .env { transform: scale(1.35); }
  @keyframes envIn { from { opacity: 0; } to { opacity: 1; } }
  .env > * { position: absolute; }
  .back { inset: 0; background-color: var(--wine); background-image: var(--noise), radial-gradient(90% 70% at 50% 52%, rgba(120, 38, 44, .55), rgba(62, 17, 21, 0) 70%), linear-gradient(180deg, #3C1014, #3A0F13); }
  .back::after { content: ''; position: absolute; inset: 0; background: radial-gradient(120% 95% at 50% 50%, transparent 55%, rgba(14, 2, 4, .55) 100%); }
  .liner { inset: 0; clip-path: polygon(0 0, 100% 0, 100% 38%, 50% 57%, 0 38%); background: linear-gradient(180deg, #1E0506, #2E0B0E 80%); }
  .liner::after { content: ''; position: absolute; inset: 0; background-image: var(--noise); opacity: .8; }
  .folds { inset: 0; width: 100%; height: 100%; z-index: 3; pointer-events: none; }
  .flap { inset: 0; z-index: 4; transform-origin: 50% 0; transform-style: preserve-3d; pointer-events: none; }
  .flap > * { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .flap-f { clip-path: polygon(0 0, 100% 0, 100% 38%, 50% 57%, 0 38%); background-color: var(--wine); background-image: var(--noise), linear-gradient(180deg, #3F1216, #411317); }
  .flap-f::after { content: ''; position: absolute; inset: 0; background: radial-gradient(90% 70% at 50% 52%, rgba(120, 38, 44, .35), transparent 70%); }
  .flap-sh { z-index: 3; width: 100%; height: 100%; filter: blur(5px); opacity: .6; transform: translateY(4px); pointer-events: none; }
  .env.open .flap { animation: flapOpen .75s cubic-bezier(.5, 0, .3, 1) .05s forwards; }
  @keyframes flapOpen { 0% { transform: rotateX(0); z-index: 4; } 49% { z-index: 4; } 50% { z-index: 0; } 100% { transform: rotateX(180deg); z-index: 0; } }
  .shade { inset: 0; z-index: 4; pointer-events: none; opacity: 0; background: linear-gradient(180deg, rgba(10, 0, 2, .5), rgba(10, 0, 2, 0) 62%); }
  .env.open .shade { animation: shadeA .9s ease .05s both; }
  @keyframes shadeA { 0% { opacity: 0; } 40% { opacity: 1; } 100% { opacity: 0; } }
  .glow { inset: 0; z-index: 5; pointer-events: none; opacity: 0; background: radial-gradient(55% 30% at 50% 57%, rgba(255, 224, 160, .55), rgba(255, 224, 160, 0) 70%); }
  .env.open .glow { animation: glowUp .9s ease-out .1s both; }
  @keyframes glowUp { 0% { opacity: 0; } 30% { opacity: 1; } 100% { opacity: 0; } }

  /* ---- тексты ---- */
  .orn { z-index: 6; left: 50%; top: 14.5%; translate: -50% 0; width: calc(38 * var(--u)); max-width: 260px; min-width: 120px; color: var(--cream); opacity: .9; animation: fadeUp 1.2s ease .2s both; }
  .orn svg { display: block; width: 100%; height: auto; overflow: visible; }
  .ttl { z-index: 6; left: 0; right: 0; top: 29%; margin: 0; text-align: center; line-height: 1; font-weight: 500; animation: fadeUp 1.2s ease .35s both; }
  .ttl .caps { display: block; font-family: var(--f-serif); font-size: clamp(16px, calc(5.1 * var(--u)), 40px); letter-spacing: .1em; text-transform: uppercase; color: var(--cream); }
  .ttl .scr { display: block; margin-top: calc(-1.6 * var(--u)); font-family: var(--f-script); font-weight: 400; font-size: clamp(32px, calc(10.8 * var(--u)), 74px); color: var(--cream); transform: skewX(-10deg); }
  .nm { display: none !important; z-index: 6; left: 0; right: 0; top: 42.3%; margin: 0; text-align: center; font-family: var(--f-serif); font-weight: 600; font-size: clamp(15px, calc(4.8 * var(--u)), 34px); letter-spacing: .22em; padding-left: .22em; text-transform: uppercase; color: var(--gold); animation: fadeUp 1.2s ease .48s both; }
  .nm i { font-style: normal; margin: 0 .35em; opacity: .85; }
  .hint { z-index: 6; left: 0; right: 0; top: 69.5%; margin: 0; text-align: center; font-family: var(--f-serif); font-weight: 500; font-size: clamp(13px, calc(4.5 * var(--u)), 30px); line-height: 1.32; color: rgba(244, 232, 214, .88); animation: fadeUp 1.2s ease .6s both; padding: 0 calc(6 * var(--u)); }
  .hint .scr { display: block; margin-top: calc(1.4 * var(--u)); font-family: var(--f-script); font-weight: 400; font-size: clamp(30px, calc(9.4 * var(--u)), 66px); line-height: 1.1; color: var(--cream); transform: skewX(-10deg); }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .env.open .orn, .env.open .ttl, .env.open .nm, .env.open .hint { animation: none; opacity: 0; transition: opacity .25s; }

  /* ---- печать ---- */
  .seal { z-index: 7; left: 50%; top: 57%; translate: -50% -50%; width: clamp(96px, calc(26 * var(--u)), 210px); aspect-ratio: 440 / 407; border: 0; padding: 0; background: none; cursor: pointer; filter: drop-shadow(0 7px 7px rgba(8, 0, 2, .55)) drop-shadow(0 1px 1px rgba(8, 0, 2, .6)); animation: sealIn 1s cubic-bezier(.2, .9, .25, 1.15) .55s both; -webkit-tap-highlight-color: transparent; }
  .seal svg { display: block; width: 100%; height: 100%; overflow: visible; }
  @keyframes sealIn { 0% { opacity: 0; scale: 1.5; translate: -50% calc(-50% - 50px); } 62% { opacity: 1; scale: .96; translate: -50% -50%; } 80% { scale: 1.02; } 100% { opacity: 1; scale: 1; translate: -50% -50%; } }
  .env.open .seal { animation: sealLift .75s cubic-bezier(.5, 0, .3, 1) .05s forwards; pointer-events: none; }
  @keyframes sealLift { 0% { transform: translateY(0) scaleY(1); opacity: 1; } 25% { transform: translateY(-13svh) scaleY(.77); opacity: 1; } 46% { transform: translateY(-50svh) scaleY(.12); opacity: 1; } 52% { transform: translateY(-58svh) scaleY(.08); opacity: 0; } 100% { transform: translateY(-80svh) scaleY(1); opacity: 0; } }
  .aura { inset: 0; z-index: 6; pointer-events: none; background: radial-gradient(calc(26 * var(--u)) calc(22 * var(--u)) at 50% 57%, rgba(255, 214, 130, .28), rgba(255, 214, 130, 0) 72%); animation: breathe 4.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { opacity: .25; } 50% { opacity: .85; } }
  .env.open .aura { animation: none; opacity: 0; }
  .dust { inset: 0; z-index: 6; pointer-events: none; overflow: hidden; }
  .dust i { position: absolute; bottom: -10px; left: var(--x); width: var(--s); height: var(--s); border-radius: 50%; background: radial-gradient(circle, #FFE9B0 0, rgba(255, 220, 140, 0) 72%); opacity: 0; animation: dust var(--t) linear infinite; animation-delay: var(--dl); }
  @keyframes dust { 0% { transform: translate(0, 0); opacity: 0; } 15% { opacity: .8; } 85% { opacity: .4; } 100% { transform: translate(var(--dx), -105vh); opacity: 0; } }

  /* ---- страница внутри (пока заглушка) ---- */
  .inside { position: relative; min-height: 100svh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(26px, 7svh, 64px); padding: 56px 0; overflow: hidden; background-color: var(--wine); background-image: var(--noise), radial-gradient(90% 70% at 50% 45%, rgba(120, 38, 44, .5), rgba(62, 17, 21, 0) 70%); }
  .inside::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(120% 95% at 50% 50%, transparent 55%, rgba(14, 2, 4, .55) 100%); }
  .in-folds { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .cap { position: relative; z-index: 2; margin: 0; display: grid; justify-items: center; gap: 8px; font: 500 clamp(20px, 5.8vw, 32px)/1 var(--f-serif); letter-spacing: .3em; padding-left: .3em; text-transform: uppercase; color: rgba(244, 232, 214, .34); }
  .cap svg { width: 96px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.2; opacity: .8; }
  .lcard { position: relative; z-index: 2; width: min(96vw, 600px); aspect-ratio: 640 / 578; container-type: inline-size; filter: drop-shadow(0 14px 18px rgba(8, 0, 2, .5)); opacity: 1; }
  @keyframes cardIn { 0% { opacity: 1; } 30% { opacity: 1; } 100% { opacity: 1; transform: none; } }
  .lflap { position: absolute; z-index: 3; left: 3%; right: 3%; top: 0; height: 40%; background: linear-gradient(#5b2228, #44141a); clip-path: polygon(0 0, 100% 0, 100% 28%, 50% 100%, 0 28%); opacity: .93; pointer-events: none; }
  @keyframes flapOut { to { transform: translateY(70%); opacity: 0; } }
  .lcard .panel { position: absolute; left: 21.8%; right: 21.8%; top: 24.8%; bottom: 24.8%; z-index: 2; background: #F6F2E3; box-shadow: inset 0 0 0 1px #D9D1BC, inset 0 0 22px rgba(120, 100, 60, .12); display: grid; align-content: center; justify-items: center; padding: 2%; }
  .lcard img { position: absolute; inset: 0; z-index: 1; width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
  .nmz { color: #5A1218; font-family: var(--f-script); font-weight: 400; line-height: 1.02; }
  .nmz { text-align: center; width: 100%; }
  .nmz .a { display: block; font-size: 12.5cqw; text-align: center; }
  .nmz .and { display: block; font-family: var(--f-serif); font-weight: 500; font-size: 4.6cqw; text-align: center; padding-left: 0; margin: 1cqw 0; color: #8D5A5F; letter-spacing: .1em; }
  .nmz .b { display: block; font-size: 12.5cqw; text-align: center; }
  .more { position: relative; z-index: 2; background-color: #F5EEDF; background-image: var(--noise), radial-gradient(90% 40% at 50% 0, rgba(255, 255, 255, .55), transparent 70%); color: #5A1218; padding: 84px 22px 70px; display: grid; gap: 0; justify-items: center; text-align: center; overflow: hidden; }
  .more .wv { position: absolute; left: 0; top: -1px; width: 100%; height: 64px; display: block; }
  .more > * + * { margin-top: 72px; }
  .blk { width: min(100%, 700px); display: grid; gap: 12px; justify-items: center; }
  .rv { opacity: 0; transform: translateY(26px); transition: opacity 1.1s ease, transform 1.1s cubic-bezier(.2, .7, .2, 1); }
  .rv.in { opacity: 1; transform: none; }
  .more .scr { font-family: var(--f-script); font-weight: 400; margin: 0; color: #5A1218; }
  .more .scr.big { font-size: clamp(44px, 12.5vw, 68px); line-height: 1.12; transform: none; }
  .more .txt { margin: 0; font-size: clamp(20px, 5.5vw, 27px); line-height: 1.5; color: #6d3a3f; }
  .more .lab { margin: 0; font-size: clamp(14px, 3.8vw, 17px); letter-spacing: .34em; padding-left: .34em; text-transform: uppercase; color: #A87A32; font-weight: 600; }
  .more .lab.sm { margin-top: 12px; letter-spacing: .22em; }
  .more .dv { margin: 0; font: 500 clamp(34px, 9.6vw, 52px)/1.15 var(--f-serif); color: #3E1115; }
  .mono { width: 112px; height: 112px; border-radius: 50%; display: flex; align-items: center; justify-content: center; gap: 3px; border: 1px solid #B88A3E; box-shadow: inset 0 0 0 5px #F5EEDF, inset 0 0 0 6px rgba(184, 138, 62, .6); font: 400 38px/1 var(--f-script); color: #5A1218; margin-bottom: 6px; }
  .pnl { position: relative; width: 100%; padding: 34px 18px 28px; display: grid; gap: 10px; justify-items: center; background: rgba(255, 255, 255, .42); border: 1px solid rgba(184, 138, 62, .75); box-shadow: inset 0 0 0 7px #F5EEDF, inset 0 0 0 8px rgba(184, 138, 62, .45), 0 18px 34px -24px rgba(62, 17, 21, .5); }
  .pnl::before, .pnl::after { content: ''; position: absolute; width: 26px; height: 26px; border: 1px solid #B88A3E; }
  .pnl::before { left: 14px; top: 14px; border-right: 0; border-bottom: 0; } .pnl::after { right: 14px; bottom: 14px; border-left: 0; border-top: 0; }
  .cdn { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; width: 100%; margin-top: 6px; }
  .cdn div { border-top: 1px solid rgba(184, 138, 62, .7); border-bottom: 1px solid rgba(184, 138, 62, .7); padding: 12px 2px 9px; display: grid; gap: 5px; }
  .cdn b { font: 600 clamp(32px, 9vw, 46px)/1 var(--f-serif); color: #5A1218; font-variant-numeric: tabular-nums; }
  .cdn i { font-style: normal; font-size: clamp(12px, 3.3vw, 15px); letter-spacing: .12em; text-transform: uppercase; color: #8d5a5f; }
  .pin { width: 44px; height: 57px; fill: none; stroke: #B88A3E; stroke-width: 1.5; }
  .prg { list-style: none; margin: 10px 0 0; padding: 0; width: 100%; display: grid; position: relative; }
  .prg::before { content: ''; position: absolute; left: 50%; top: 8px; bottom: 8px; width: 1px; background: linear-gradient(transparent, #B88A3E 12%, #B88A3E 88%, transparent); }
  .prg li { display: grid; grid-template-columns: 1fr 1fr; align-items: center; gap: 30px; padding: 15px 0; position: relative; }
  .prg li::after { content: ''; position: absolute; left: 50%; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; transform: rotate(45deg); background: #F5EEDF; border: 1px solid #B88A3E; }
  .prg b { font: 600 clamp(28px, 7.6vw, 36px)/1 var(--f-serif); color: #5A1218; text-align: right; }
  .prg span { font-size: clamp(21px, 5.6vw, 27px); color: #4a2226; text-align: left; }
  .prg li:nth-child(even) b { order: 2; text-align: left; } .prg li:nth-child(even) span { order: 1; text-align: right; }
  .rsvp { overflow: hidden; position: relative; z-index: 2; background-color: #3E1115; background-image: var(--noise), radial-gradient(80% 60% at 50% 40%, rgba(130, 42, 50, .45), transparent 75%); color: #F4E8D6; padding: 96px 22px 70px; display: grid; justify-items: center; text-align: center; gap: 14px; }
  .rsvp .wv2 { position: absolute; left: 0; top: -1px; width: 100%; height: 56px; display: block; }
  .rsvp .scr { font-family: var(--f-script); font-weight: 400; margin: 0; color: #F4E8D6; font-size: clamp(44px, 12.5vw, 68px); line-height: 1.12; transform: none; }
  .rsvp .txt { margin: 0; font-size: clamp(20px, 5.4vw, 26px); line-height: 1.5; color: rgba(244, 232, 214, .8); max-width: 420px; }
  .rsvp .box { width: min(100%, 620px); display: grid; gap: 14px; padding: 26px 20px; border: 1px solid rgba(217, 181, 103, .6); box-shadow: inset 0 0 0 6px #3E1115, inset 0 0 0 7px rgba(217, 181, 103, .3); background: rgba(20, 3, 6, .25); margin-top: 8px; }
  .rsn { width: 100%; font: 500 clamp(21px, 5.6vw, 26px) var(--f-serif); padding: 14px 16px; border: 1px solid rgba(217, 181, 103, .55); background: rgba(255, 255, 255, .06); color: #F4E8D6; border-radius: 0; text-align: center; outline: none; }
  .rsn::placeholder { color: rgba(244, 232, 214, .5); }
  .rsn:focus { border-color: #D9B567; }
  .rsb { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .rsb button { font: 600 clamp(19px, 5vw, 23px) var(--f-serif); letter-spacing: .08em; padding: 15px 8px; border: 1px solid #D9B567; background: linear-gradient(#E3C27A, #C79A45); color: #3E1115; cursor: pointer; }
  .rsb button.no { background: transparent; color: #F4E8D6; }
  .rsb button:disabled { opacity: .4; cursor: not-allowed; }
  .thx { font-size: clamp(19px, 5vw, 23px) !important; color: #E3C27A !important; }
  .end { display: grid; gap: 8px; justify-items: center; margin-top: 34px; }
  .end .scr { color: #D9B567; font-size: clamp(56px, 16vw, 92px); }
  .end .orn2 { width: 120px; height: 16px; fill: none; stroke: #D9B567; stroke-width: 1.2; opacity: .8; }

  #prog { position: fixed; left: 0; top: 0; height: 3px; width: 100%; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, #8a5a1c, #F3D98F, #C79A45); z-index: 6; pointer-events: none; }
  .pt { position: absolute; bottom: -12px; width: var(--s); height: var(--s); border-radius: 50%; background: radial-gradient(circle, #F6E2A0 0%, rgba(217, 181, 103, .5) 45%, rgba(217, 181, 103, 0) 70%); opacity: 0; pointer-events: none; z-index: 1; animation: rise var(--d) linear var(--dl) infinite; }
  @keyframes rise { 0% { transform: translate(0, 0); opacity: 0; } 12% { opacity: .85; } 85% { opacity: .55; } 100% { transform: translate(var(--x), calc(-1 * var(--h))); opacity: 0; } }
  .nmz .a, .nmz .and, .nmz .b { opacity: 0; }
  .page.show .nmz .a { animation: nameIn 1s cubic-bezier(.2, .7, .2, 1) .35s forwards; }
  .page.show .nmz .and { animation: nameIn .9s ease .6s forwards; }
  .page.show .nmz .b { animation: nameIn 1s cubic-bezier(.2, .7, .2, 1) .8s forwards; }
  @keyframes nameIn { from { opacity: 0; filter: blur(10px); transform: translateY(14px) scale(.97); } to { opacity: 1; filter: blur(0); transform: none; } }
  .page .cap { opacity: 0; } .page.show .cap { animation: capIn 1.2s ease .9s forwards; }
  @keyframes capIn { from { opacity: 0; letter-spacing: .1em; } to { opacity: 1; letter-spacing: .3em; } }
  .page.show .lcard { animation: glow 4.5s ease-in-out 2s infinite; }
  @keyframes glow { 0%, 100% { filter: drop-shadow(0 14px 18px rgba(8, 0, 2, .5)) drop-shadow(0 0 0 rgba(243, 217, 143, 0)); } 50% { filter: drop-shadow(0 14px 18px rgba(8, 0, 2, .5)) drop-shadow(0 0 16px rgba(243, 217, 143, .28)); } }

      p.style.cssText = 'left:' + (Math.random() * 100).toFixed(1) + '%;--s:' + (3 + Math.random() * 6).toFixed(1) + 'px;--d:' + (9 + Math.random() * 10).toFixed(1) + 's;--dl:-' + (Math.random() * 14).toFixed(1) + 's;--x:' + ((Math.random() - .5) * 90).toFixed(0) + 'px;--h:' + h + 'px';
      box.appendChild(p);
    }
  }
  if (!reduce) { document.querySelectorAll('.inside, .flow').forEach((b) => dust(b, 16)); }
  const prog = $('prog');
  let tk = 0;
  addEventListener('scroll', () => { if (tk) return; tk = requestAnimationFrame(() => { tk = 0; const m = document.documentElement.scrollHeight - innerHeight; prog.style.transform = 'scaleX(' + (m > 0 ? Math.min(1, scrollY / m) : 0) + ')'; }); }, { passive: true });

  const MN = { ru: ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'], uz: ['yanvar','fevral','mart','aprel','may','iyun','iyul','avgust','sentyabr','oktyabr','noyabr','dekabr'] };
  const WD = { ru: ['пн','вт','ср','чт','пт','сб','вс'], uz: ['du','se','ch','pa','ju','sh','ya'] };
  const VENUE_Q = 'Ташкент банкетный зал';
  const WY = 2027, WM = 5, WDAY = 20;
  function renderCal() {
    const first = (new Date(WY, WM, 1).getDay() + 6) % 7, days = new Date(WY, WM + 1, 0).getDate();
    let h = '<p class="mn">' + MN[lang][WM] + ' ' + WY + '</p><div class="g">' + WD[lang].map((w) => '<span class="w">' + w + '</span>').join('');
    for (let i = 0; i < first; i++) h += '<span></span>';
    for (let d = 1; d <= days; d++) { const we = ((first + d - 1) % 7) > 4; h += '<span class="d' + (we ? ' we' : '') + (d === WDAY ? ' on' : '') + '">' + d + (d === WDAY ? '<i>♥</i>' : '') + '</span>'; }
    $('cal').innerHTML = h + '</div>';
  }
  $('addc').addEventListener('click', () => {
    const ttl = (lang === 'ru' ? 'Свадьба: ' : 'To‘y: ') + NAMES[lang][0] + ' & ' + NAMES[lang][1];
    const u = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(ttl) + '&dates=20270620T120000Z/20270620T190000Z';
    window.open(u, '_blank', 'noopener');
  });

  /* curved (slightly oval) flap shapes */
  const SH = (() => {
    const N = 28, f = (u) => { const a = Math.pow(Math.sqrt(u * u + .0016), 1.45), b = Math.pow(Math.sqrt(1.0016), 1.45), c0 = Math.pow(.04, 1.45); return (1 - (a - c0) / (b - c0)); };
    const crv = (ys, ya, from, to) => { const p = []; for (let i = 0; i <= N; i++) { const x = from + (to - from) * i / N, u = (x - 50) / 50; p.push((x).toFixed(2) + '% ' + (ys + (ya - ys) * Math.max(0, f(u))).toFixed(2) + '%'); } return p; };
    const top = (ya) => 'polygon(0 0, 100% 0, ' + crv(38, ya, 100, 0).join(', ') + ')';
    const bot = (ya) => 'polygon(0 100%, 100% 100%, ' + crv(76, ya, 100, 0).join(', ') + ')';
    const lft = () => 'polygon(' + crv(38, 57, 0, 50).concat(crv(76, 57, 50, 0)).join(', ') + ')';
    const rgt = () => 'polygon(' + crv(38, 57, 100, 50).concat(crv(76, 57, 50, 100)).join(', ') + ')';
    return { top, bot, lft, rgt };
  })();
  (() => {
    const s = document.createElement('style');
    s.textContent = '@keyframes flapT { 0% { clip-path: ' + SH.top(57) + '; opacity: 1; } 85% { opacity: 1; } 100% { clip-path: ' + SH.top(1) + '; opacity: 0; } } @keyframes flapB { 0% { clip-path: ' + SH.bot(57) + '; opacity: 1; } 85% { opacity: 1; } 100% { clip-path: ' + SH.bot(99) + '; opacity: 0; } }';
    document.head.appendChild(s);
  })();
  (function () { const im = document.querySelector('.lcard img'); if (im) document.documentElement.style.setProperty('--lace', 'url(' + im.src + ')'); })();
  function renderX() {
    renderCal();
    const d = X[lang], nn = NAMES[lang];
    document.querySelectorAll('[data-t]').forEach((n) => { if (d[n.dataset.t] !== undefined) n.textContent = d[n.dataset.t]; });
    document.querySelectorAll('[data-ph]').forEach((n) => { n.placeholder = d[n.dataset.ph]; });
    const q = encodeURIComponent(VENUE_Q); $('mg').href = 'https://www.google.com/maps/search/?api=1&query=' + q; $('my').href = 'https://yandex.com/maps/?text=' + q;
    $('f1').textContent = nn[0]; $('f2').textContent = nn[1]; 
  }
  const target = new Date('2027-06-20T17:00:00+05:00').getTime();
  function tick() {
    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
    const D = Math.floor(s / 86400); s -= D * 86400; const H = Math.floor(s / 3600); s -= H * 3600; const M = Math.floor(s / 60); s -= M * 60;
    [['cD', D], ['cH', String(H).padStart(2, '0')], ['cM', String(M).padStart(2, '0')], ['cS', String(s).padStart(2, '0')]].forEach(([id, v]) => { const n = $(id); if (n.textContent !== String(v)) { n.textContent = v; n.classList.remove('tk'); void n.offsetWidth; n.classList.add('tk'); } });
  }
  tick(); setInterval(tick, 1000);
  const rsn = $('rsn');
  rsn.addEventListener('input', () => { const ok = rsn.value.trim().length > 1; $('rsY').disabled = !ok; $('rsN').disabled = !ok; });
  function rsvp(yes) {
    const nm = rsn.value.trim(); if (nm.length < 2) return;
    const msg = (lang === 'ru' ? (yes ? '✅ Приду: ' : '❌ Не смогу: ') : (yes ? '✅ Kelaman: ' : '❌ Kela olmayman: ')) + nm;
    $('rsT').hidden = false;
    location.href = 'tg://resolve?phone=' + tgp + '&text=' + encodeURIComponent(msg);
  }
  $('rsY').addEventListener('click', () => rsvp(true)); $('rsN').addEventListener('click', () => rsvp(false));
  const io = ('IntersectionObserver' in window) ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .15 }) : null;
  document.querySelectorAll('.rv').forEach((n) => io ? io.observe(n) : n.classList.add('in'));
  function render() {
    const d = T[lang];
    const nn = NAMES[lang];
    $('t1').textContent = d.t1; $('t2').textContent = d.t2; $('h1').innerHTML = d.h1; $('h2').textContent = d.h2;
    $('cap1').textContent = d.cap; $('cap2').textContent = d.cap; $('n1').textContent = nn[0]; $('n2').textContent = nn[1]; document.title = d.ttl; root.lang = lang;
    document.querySelectorAll('[data-lang]').forEach((b) => b.setAttribute('aria-pressed', b.dataset.lang === lang));
    renderX();
  }
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; store.set('gold_lang', lang); render(); }));
  render();

  /* ветка лавра над текстом: рисуется из кода, всегда симметрична */
  (function () {
    const NS = 'http://www.w3.org/2000/svg', svg = $('orn'); let h = '';
    const leaf = (x, y, ang, l, w) => '<g transform="translate(' + x.toFixed(1) + ' ' + y.toFixed(1) + ') rotate(' + ang.toFixed(1) + ')"><path d="M0 0C' + (l * .3) + ' ' + (-w) + ' ' + (l * .75) + ' ' + (-w * .8) + ' ' + l + ' 0C' + (l * .75) + ' ' + (w * .8) + ' ' + (l * .3) + ' ' + w + ' 0 0Z"/><path d="M2 0H' + (l * .85) + '" stroke-opacity=".55"/></g>';
    function branch(sign) {
      let s = ''; const P0 = [0, 106], P1 = [sign * 62, 104], P2 = [sign * 84, 52], P3 = [sign * 36, 8];
      const pt = (t) => { const u = 1 - t; return [u * u * u * P0[0] + 3 * u * u * t * P1[0] + 3 * u * t * t * P2[0] + t * t * t * P3[0], u * u * u * P0[1] + 3 * u * u * t * P1[1] + 3 * u * t * t * P2[1] + t * t * t * P3[1]]; };
      const dv = (t) => { const u = 1 - t; return [3 * u * u * (P1[0] - P0[0]) + 6 * u * t * (P2[0] - P1[0]) + 3 * t * t * (P3[0] - P2[0]), 3 * u * u * (P1[1] - P0[1]) + 6 * u * t * (P2[1] - P1[1]) + 3 * t * t * (P3[1] - P2[1])]; };
      s += '<path d="M' + P0 + ' C' + P1 + ' ' + P2 + ' ' + P3 + '" fill="none"/>';
      for (let i = 1; i <= 7; i++) {
        const t = i / 8.2, p = pt(t), d = dv(t), a = Math.atan2(d[1], d[0]) * 180 / Math.PI, k = 15 - i * .9;
        s += leaf(p[0], p[1], a + (sign > 0 ? -38 : 38) * 1, k, k * .34);
        s += leaf(p[0], p[1], a + (sign > 0 ? 38 : -38) * 1, k * .92, k * .32);
      }
      return s;
    }
    h += '<g transform="translate(100 0)" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">' + branch(1) + branch(-1) + '<path d="M0 100V112M-5 112H5" stroke-width="1"/></g>';
    svg.innerHTML = h;
  })();

  /* золотые искры */
  if (!reduce) {
    const box = $('dust');
    for (let i = 0; i < 12; i++) {
      const p = document.createElement('i');
      p.style.cssText = '--x:' + ((i * 8.7 + 5) % 100) + '%;--s:' + (3 + (i % 4)) + 'px;--t:' + (9 + (i % 5) * 2) + 's;--dl:' + (-i * 1.7) + 's;--dx:' + ((i % 2 ? 1 : -1) * (14 + i * 4)) + 'px';
      box.appendChild(p);
    }
  }

  /* открытие конверта */
  let opened = false;
  function open() {
    if (opened) return; opened = true;
    const env = $('env'), stage = $('stage');
    const parts = [];
    if (reduce) { $('page').classList.add('show'); fin_(); return; }
    ['ht', 'hl', 'hr', 'hs'].forEach(k => {
      const c = stage.cloneNode(true);
      c.removeAttribute('id'); c.querySelectorAll('[id]').forEach(n => n.removeAttribute('id'));
      c.setAttribute('aria-hidden', 'true'); c.style.pointerEvents = 'none';
      if (k === 'hs') { c.querySelectorAll('.back, .liner, .folds, .flap, .shade, .dust, .orn, .ttl, .hint, .lang, .aura, .glow').forEach(n => n.remove()); }
      else { c.querySelectorAll('.seal, .dust, .orn, .ttl, .hint, .lang, .aura, .glow').forEach(n => n.remove()); }
      c.classList.add('half', k); if (k === 'ht') c.style.clipPath = SH.top(57); if (k === 'hl') c.style.clipPath = SH.lft(); if (k === 'hr') c.style.clipPath = SH.rgt();
      stage.after(c); parts.push(c);
    });
    stage.classList.add('half', 'hb'); stage.style.clipPath = SH.bot(57); $('page').classList.add('show');
    void stage.offsetWidth;
    requestAnimationFrame(() => { parts.concat(stage).forEach(p => p.classList.add('go')); });
    setTimeout(() => { parts.forEach(p => p.remove()); stage.hidden = true; root.classList.remove('locked'); window.scrollTo(0, 0); }, 2700);
    function fin_() { stage.hidden = true; root.classList.remove('locked'); }
  }
  root.classList.add('locked');
  $('seal').addEventListener('click', open);
  $('env').addEventListener('click', (e) => { if (e.target.closest('.seal')) return; });
})();
</script>
