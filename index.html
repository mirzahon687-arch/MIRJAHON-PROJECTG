<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Свадьба Жасура и Нилюфар</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: { display: ['var(--font-display)'], body: ['var(--font-body)'] },
        colors: {
          paper: 'var(--paper)', ink: 'var(--ink)', soft: 'var(--ink-soft)',
          goldink: 'var(--gold-ink)', gold: 'var(--gold)', line: 'var(--line)'
        }
      }
    }
  };
</script>
<style>
  /* Layout: cover doors open onto a staggered-name hero, then a date/place split, a timeline, dress code and RSVP. Gold foil on white, one shimmering moment (the names). */
  :root {
    --gold-hi: #F3E2A9;
    --gold: #D4AF5F;
    --gold-lo: #A9812F;
    --gold-ink: #7A5A19;
    --paper: #FFFFFF;
    --ink: #3A3020;
    --ink-soft: #6A5D44;
    --line: #E7D9B0;
    --font-display: 'Cormorant Garamond', 'Times New Roman', serif;
    --font-body: 'Jost', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  html { scroll-behavior: smooth; }
  html.locked, html.locked body { overflow: hidden; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.65;
    padding-inline: 16px;
    -webkit-text-size-adjust: 100%;
  }
  @media (min-width: 640px) { body { padding-inline: 24px; } }

  .eyebrow { font-size: .75rem; letter-spacing: .32em; text-transform: uppercase; color: var(--gold-ink); font-weight: 500; }
  .gold-text {
    background: linear-gradient(100deg, var(--gold-lo) 0%, #E8C873 28%, var(--gold-hi) 50%, #D9B35E 72%, var(--gold-lo) 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    color: transparent; -webkit-text-fill-color: transparent;
    animation: foil 9s linear infinite;
  }
  @keyframes foil { from { background-position: 0% 0; } to { background-position: 200% 0; } }

  .gborder {
    border: 1px solid transparent;
    background:
      linear-gradient(var(--paper), var(--paper)) padding-box,
      linear-gradient(135deg, var(--gold-hi), var(--gold-lo) 50%, var(--gold-hi)) border-box;
  }
  .btn-gold, .btn-line {
    display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
    padding: .8rem 1.4rem; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; font-weight: 500;
    text-decoration: none; cursor: pointer; transition: transform .2s ease, filter .2s ease, background-color .2s ease;
  }
  .btn-gold { background: linear-gradient(135deg, #EBD28B, #CFA64E 55%, #E6C879); color: #2F2410; border: 1px solid #B8903A; }
  .btn-gold:hover { filter: brightness(1.05); transform: translateY(-1px); }
  .btn-line { border: 1px solid var(--gold-lo); color: var(--gold-ink); background: transparent; }
  .btn-line:hover { background: #FBF3D9; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--gold-lo); outline-offset: 3px; }

  /* Language switch */
  .lang { position: fixed; top: calc(24px + env(safe-area-inset-top, 0px)); right: 26px; z-index: 60; display: flex; gap: 2px; padding: 3px; }
  .lang button { padding: .3rem .75rem; font-size: .75rem; letter-spacing: .14em; font-weight: 500; color: var(--gold-ink); cursor: pointer; }
  .lang button[aria-pressed="true"] { background: linear-gradient(135deg, #EBD28B, #CFA64E 55%, #E6C879); color: #2F2410; }

  /* Cover */
  #cover { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; }
  .panel { position: absolute; top: 0; bottom: 0; width: 50.2%; background: linear-gradient(180deg, #FFFFFF 0%, #FFF8E3 100%); transition: transform 1.15s cubic-bezier(.77, 0, .18, 1) .35s; }
  .panel.l { left: 0; border-right: 1px solid var(--gold); }
  .panel.r { right: 0; border-left: 1px solid var(--gold); }
  #cover.open .panel.l { transform: translateX(-101%); }
  #cover.open .panel.r { transform: translateX(101%); }
  #coverLayer {
    position: absolute; inset: 0; display: flex; overflow-y: auto;
    padding: calc(28px + env(safe-area-inset-top, 0px)) 28px calc(28px + env(safe-area-inset-bottom, 0px));
    transition: opacity .5s ease, transform .6s ease;
  }
  #cover.open #coverLayer { opacity: 0; transform: scale(1.04); pointer-events: none; }
  .cover-frame { position: absolute; inset: calc(14px + env(safe-area-inset-top, 0px)) 14px calc(14px + env(safe-area-inset-bottom, 0px)); border: 1px solid var(--gold); pointer-events: none; }
  .cover-frame::after { content: ""; position: absolute; inset: 6px; border: 1px solid var(--line); }
  .monogram { width: 124px; height: 124px; border-radius: 9999px; padding: 2px; background: linear-gradient(135deg, var(--gold-hi), var(--gold-lo) 50%, var(--gold-hi)); }
  .monogram > div { width: 100%; height: 100%; border-radius: 9999px; background: var(--paper); display: flex; align-items: center; justify-content: center; }

  /* Reveal after opening */
  .opened .rise { animation: rise .9s cubic-bezier(.2, .7, .2, 1) both; animation-delay: var(--d, 0s); }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

  .hero-glow { background: radial-gradient(60% 55% at 50% 0%, rgba(243, 226, 169, .5), rgba(243, 226, 169, 0) 72%); }
  .names { font-size: clamp(3.5rem, 15vw, 7.25rem); line-height: .95; }

  /* Timeline */
  .timeline { list-style: none; margin: 0; padding: 0; border-left: 1px solid var(--line); margin-left: 6px; }
  .timeline li { position: relative; padding: 0 0 2rem 1.75rem; }
  .timeline li:last-child { padding-bottom: 0; }
  .timeline li::before { content: ""; position: absolute; left: -6px; top: .55rem; width: 11px; height: 11px; transform: rotate(45deg); background: var(--paper); border: 1px solid var(--gold-lo); }

  /* Music button */
  .music { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 40; display: inline-flex; align-items: center; gap: .6rem; padding: .6rem 1rem; font-size: .8rem; color: var(--gold-ink); cursor: pointer; }
  .eq { display: flex; gap: 3px; align-items: flex-end; height: 18px; }
  .eq i { display: block; width: 4px; height: 4px; background: currentColor; border-radius: 1px; transition: height .08s linear; }
  .eq i:nth-child(1) { height: 6px; } .eq i:nth-child(2) { height: 11px; } .eq i:nth-child(3) { height: 7px; }

  .swatch { width: 56px; height: 56px; border-radius: 9999px; flex: none; }

  /* Scroll reveal (active only when JS and IntersectionObserver are available) */
  .js-reveal .rv { opacity: 0; transition: opacity .95s cubic-bezier(.2, .7, .2, 1), transform .95s cubic-bezier(.2, .7, .2, 1); transition-delay: var(--rd, 0s); }
  .js-reveal .rv-up { transform: translateY(36px); }
  .js-reveal .rv-left { transform: translateX(-44px); }
  .js-reveal .rv-right { transform: translateX(44px); }
  .js-reveal .rv-zoom { transform: scale(.78); }
  .js-reveal .rv.in { opacity: 1; transform: none; }

  /* Decorations */
  .scroll-progress { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; height: 3px; z-index: 70; transform-origin: 0 50%; transform: scaleX(0); background: linear-gradient(90deg, var(--gold-hi), var(--gold-lo)); pointer-events: none; }
  .sparks { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .spark { position: absolute; bottom: -12px; border-radius: 9999px; opacity: 0; background: radial-gradient(circle, #F7E7B4 0%, #D9B35E 55%, rgba(217, 179, 94, 0) 72%); animation: floatUp linear infinite; }
  @keyframes floatUp {
    0% { transform: translate3d(0, 0, 0); opacity: 0; }
    10% { opacity: .85; }
    90% { opacity: .5; }
    100% { transform: translate3d(var(--dx, 20px), -110vh, 0); opacity: 0; }
  }
  .deco { position: absolute; inset: 0; pointer-events: none; }
  .st { position: absolute; height: auto; }
  .tw { animation: twinkle 3.2s ease-in-out infinite; animation-delay: var(--td, 0s); }
  @keyframes twinkle { 0%, 100% { opacity: .25; scale: .8; } 50% { opacity: 1; scale: 1.15; } }
  .moon-a { position: absolute; right: 7%; top: 112px; width: clamp(56px, 13vw, 104px); height: auto; translate: 0 var(--py, 0px); animation: floaty 7s ease-in-out infinite; filter: drop-shadow(0 0 12px rgba(212, 175, 95, .5)); }
  @keyframes floaty { 0%, 100% { transform: translateY(0) rotate(-8deg); } 50% { transform: translateY(-12px) rotate(4deg); } }
  .moon-b { translate: 0 var(--py, 0px); filter: drop-shadow(0 0 14px rgba(212, 175, 95, .45)); }
  .moon-s { filter: drop-shadow(0 0 6px rgba(212, 175, 95, .5)); }
  .ornament { display: flex; align-items: center; justify-content: center; gap: 12px; }
  .ornament .line { display: block; height: 1px; width: min(26vw, 110px); background: linear-gradient(90deg, rgba(201, 162, 78, 0), #C9A24E); }
  .ornament .line.r { background: linear-gradient(270deg, rgba(201, 162, 78, 0), #C9A24E); }
  .pin { position: relative; width: 26px; height: 34px; flex: none; }
  .pin svg { position: relative; display: block; animation: pinBob 2.4s ease-in-out infinite; }
  .pin .pulse { position: absolute; left: 50%; bottom: -3px; width: 34px; height: 12px; margin-left: -17px; border: 1px solid var(--gold-lo); border-radius: 50%; animation: ping 2.4s ease-out infinite; }
  @keyframes ping { 0% { transform: scale(.35); opacity: .9; } 100% { transform: scale(1.5); opacity: 0; } }
  @keyframes pinBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
  .monogram { position: relative; }
  .monogram::before { content: ""; position: absolute; inset: -9px; border-radius: 9999px; border: 1px dashed var(--gold); animation: spin 40s linear infinite; }
  .btn-gold { position: relative; overflow: hidden; }
  .btn-gold::after { content: ""; position: absolute; top: 0; bottom: 0; left: -60%; width: 40%; background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .6), rgba(255, 255, 255, 0)); transform: skewX(-20deg); animation: sheen 5s ease-in-out infinite; pointer-events: none; }
  @keyframes sheen { 0%, 60% { left: -60%; } 100% { left: 130%; } }
  #heroDate::before, #heroDate::after { content: "\2726"; color: var(--gold); font-size: .55em; margin: 0 .7em; vertical-align: .15em; }
  .gborder { transition: transform .35s ease, box-shadow .35s ease; }
  .gborder:hover { transform: translateY(-3px); box-shadow: 0 10px 28px -14px rgba(169, 129, 47, .55); }
  .rosette { position: absolute; left: 50%; top: 50%; translate: -50% -50%; width: clamp(140px, 38vw, 250px); height: auto; opacity: .45; pointer-events: none; animation: spin 90s linear infinite; }
  @media (min-width: 768px) { .rosette { left: -10px; translate: 0 -50%; opacity: .55; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .corner { position: absolute; width: 28px; height: 28px; pointer-events: none; }
  .corner.tl { top: 7px; left: 7px; }
  .corner.tr { top: 7px; right: 7px; transform: scaleX(-1); }
  .corner.bl { bottom: 7px; left: 7px; transform: scaleY(-1); }
  .corner.br { bottom: 7px; right: 7px; transform: scale(-1, -1); }
  .timeline { position: relative; }
  .timeline::after { content: ""; position: absolute; left: -1px; top: 0; width: 2px; height: var(--p, 0%); background: linear-gradient(var(--gold-hi), var(--gold-lo)); }
  .timeline li::before { transition: background-color .6s ease .35s, box-shadow .6s ease .35s; }
  .timeline li.in::before { background: var(--gold); box-shadow: 0 0 0 4px rgba(212, 175, 95, .22); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  }
</style>

</head>
<body>
<!-- Shared ornaments -->
<svg width="0" height="0" style="position: absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3E2A9"/><stop offset=".5" stop-color="#D4AF5F"/><stop offset="1" stop-color="#A9812F"/>
    </linearGradient>
    <mask id="mMoon"><rect width="100" height="100" fill="#fff"/><circle cx="66" cy="40" r="34" fill="#000"/></mask>
  </defs>
  <symbol id="moon" viewBox="0 0 100 100"><circle cx="46" cy="54" r="38" fill="url(#gGold)" mask="url(#mMoon)"/></symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" fill="url(#gGold)"/></symbol>
  <symbol id="rosette" viewBox="0 0 100 100"><g fill="none" stroke="url(#gGold)" stroke-width="0.8"><rect x="17" y="17" width="66" height="66"/><rect x="17" y="17" width="66" height="66" transform="rotate(45 50 50)"/><circle cx="50" cy="50" r="33"/><circle cx="50" cy="50" r="22"/><circle cx="50" cy="50" r="4" fill="url(#gGold)"/></g></symbol>
  <symbol id="rings" viewBox="0 0 60 40"><g fill="none" stroke="url(#gGold)" stroke-width="1.8"><circle cx="22" cy="23" r="13"/><circle cx="38" cy="23" r="13"/></g><path d="M38 1.5L41.5 6L38 10.5L34.5 6Z" fill="url(#gGold)"/></symbol>
  <symbol id="corner" viewBox="0 0 30 30"><path d="M1 29V9Q1 1 9 1H29" fill="none" stroke="#C9A24E" stroke-width="1.2"/><path d="M9 5.5L12.5 9L9 12.5L5.5 9Z" fill="#C9A24E"/></symbol>
</svg>
<div id="progress" class="scroll-progress" aria-hidden="true"></div>
<div id="sparks" class="sparks" aria-hidden="true"></div>

<!-- Language switch -->
<div id="langSwitch" class="lang gborder" role="group" aria-label="Til / Язык">
  <button type="button" data-lang="ru" aria-pressed="true">RU</button>
  <button type="button" data-lang="uz" aria-pressed="false">UZ</button>
</div>

<!-- Cover -->
<div id="cover" role="dialog" aria-label="Свадебное приглашение">
  <div class="panel l"></div>
  <div class="panel r"></div>
  <div id="coverLayer">
    <div class="cover-frame"></div>
    <div class="relative m-auto flex flex-col items-center text-center" style="max-width: 22rem">
      <div class="flex items-center gap-4 mb-5" aria-hidden="true">
        <svg class="tw" width="12" height="12" viewBox="0 0 24 24"><use href="#star"/></svg>
        <svg class="moon-s" width="40" height="40" viewBox="0 0 100 100"><use href="#moon"/></svg>
        <svg class="tw" style="--td: 1.2s" width="12" height="12" viewBox="0 0 24 24"><use href="#star"/></svg>
      </div>
      <div class="monogram"><div><span id="mono" class="gold-text font-display italic" style="font-size: 2.6rem; line-height: 1"></span></div></div>
      <p class="eyebrow mt-8" data-i18n="eyebrow"></p>
      <p id="coverNames" class="font-display italic text-ink mt-3" style="font-size: clamp(2.2rem, 9vw, 3rem); line-height: 1.05"></p>
      <p id="coverDate" class="font-display text-soft mt-3 text-xl"></p>
      <button id="openBtn" type="button" class="btn-gold mt-10" data-i18n="open"></button>
      <p class="mt-4 text-xs text-soft" data-i18n="hint"></p>
    </div>
  </div>
</div>

<main id="main" class="mx-auto w-full max-w-3xl pb-28" style="position: relative; z-index: 1">
  <!-- Hero -->
  <section class="hero-glow relative overflow-hidden text-center pt-20 pb-12">
    <div class="deco" aria-hidden="true">
      <svg id="heroMoon" class="moon-a" viewBox="0 0 100 100"><use href="#moon"/></svg>
      <svg class="st tw" style="left: 9%; top: 150px; width: 18px" viewBox="0 0 24 24"><use href="#star"/></svg>
      <svg class="st tw" style="right: 26%; top: 92px; width: 12px; --td: 1.1s" viewBox="0 0 24 24"><use href="#star"/></svg>
      <svg class="st tw" style="left: 22%; top: 340px; width: 10px; --td: .6s" viewBox="0 0 24 24"><use href="#star"/></svg>
      <svg class="st tw" style="right: 9%; top: 380px; width: 16px; --td: 1.7s" viewBox="0 0 24 24"><use href="#star"/></svg>
    </div>
    <p class="eyebrow rise" style="--d: .7s" data-i18n="eyebrow"></p>
    <h1 class="names font-display italic font-medium mt-8 mx-auto flex flex-col" style="max-width: 30rem">
      <span id="n1" class="gold-text self-center sm:self-start rise" style="--d: .9s"></span>
      <span class="font-display text-goldink text-4xl sm:text-5xl my-1 rise" style="--d: 1.05s" aria-hidden="true">&amp;</span>
      <span id="n2" class="gold-text self-center sm:self-end rise" style="--d: 1.2s"></span>
    </h1>
    <p id="heroDate" class="font-display text-2xl sm:text-3xl mt-10 rise" style="--d: 1.4s"></p>

    <div id="countdown" class="grid grid-cols-4 gap-2 sm:gap-4 mt-10 mx-auto rise" style="max-width: 30rem; --d: 1.55s" aria-live="off">
      <div class="gborder py-3 sm:py-4"><div id="cd-d" class="font-display text-3xl sm:text-4xl tabular-nums leading-none">0</div><div id="cl-d" class="text-[.65rem] sm:text-xs tracking-widest uppercase text-goldink mt-2"></div></div>
      <div class="gborder py-3 sm:py-4"><div id="cd-h" class="font-display text-3xl sm:text-4xl tabular-nums leading-none">0</div><div id="cl-h" class="text-[.65rem] sm:text-xs tracking-widest uppercase text-goldink mt-2"></div></div>
      <div class="gborder py-3 sm:py-4"><div id="cd-m" class="font-display text-3xl sm:text-4xl tabular-nums leading-none">0</div><div id="cl-m" class="text-[.65rem] sm:text-xs tracking-widest uppercase text-goldink mt-2"></div></div>
      <div class="gborder py-3 sm:py-4"><div id="cd-s" class="font-display text-3xl sm:text-4xl tabular-nums leading-none">0</div><div id="cl-s" class="text-[.65rem] sm:text-xs tracking-widest uppercase text-goldink mt-2"></div></div>
    </div>
    <p id="cdDone" class="font-display italic text-2xl text-goldink mt-10" data-i18n="cdDone" hidden></p>
  </section>

  <!-- Invitation text -->
  <section class="text-center py-10">
    <div class="ornament" aria-hidden="true"><span class="line"></span><svg class="tw" width="10" height="10" viewBox="0 0 24 24"><use href="#star"/></svg><svg class="moon-s" width="34" height="34" viewBox="0 0 100 100"><use href="#moon"/></svg><svg class="tw" style="--td: 1.4s" width="10" height="10" viewBox="0 0 24 24"><use href="#star"/></svg><span class="line r"></span></div>
    <p id="invite" class="font-display text-2xl sm:text-3xl leading-snug mx-auto mt-8 text-ink" style="max-width: 34rem; text-wrap: balance"></p>
  </section>

  <!-- Blessing -->
  <section class="text-center py-14">
    <svg id="blessMoon" class="moon-b mx-auto" width="88" height="88" viewBox="0 0 100 100" aria-hidden="true"><use href="#moon"/></svg>
    <p class="font-display italic text-2xl sm:text-3xl mx-auto mt-6 text-soft" style="max-width: 30rem; text-wrap: balance" data-i18n="blessing"></p>
  </section>

  <!-- Date and place -->
  <section class="grid gap-8 md:grid-cols-[minmax(0,5fr)_minmax(0,6fr)] py-10">
    <div id="dateCol" class="min-w-0 flex flex-col justify-center items-center text-center md:items-start md:text-left">
      <p class="eyebrow" data-i18n="dateLabel"></p>
      <p id="weekday" class="font-display italic text-2xl text-soft mt-2"></p>
      <div class="relative">
        <svg class="rosette" viewBox="0 0 100 100" aria-hidden="true"><use href="#rosette"/></svg>
        <p id="bigDay" class="relative font-display gold-text font-medium leading-none" style="font-size: clamp(6rem, 24vw, 9rem)"></p>
      </div>
      <p id="monthYear" class="font-display text-3xl"></p>
      <p id="timeLine" class="mt-3 text-soft"></p>
    </div>
    <div id="placeCard" class="gborder relative min-w-0 p-6 sm:p-8 flex flex-col gap-4 items-center text-center md:items-start md:text-left">
      <svg class="corner tl" viewBox="0 0 30 30" aria-hidden="true"><use href="#corner"/></svg>
      <svg class="corner tr" viewBox="0 0 30 30" aria-hidden="true"><use href="#corner"/></svg>
      <svg class="corner bl" viewBox="0 0 30 30" aria-hidden="true"><use href="#corner"/></svg>
      <svg class="corner br" viewBox="0 0 30 30" aria-hidden="true"><use href="#corner"/></svg>
      <div class="flex items-center gap-3">
        <div class="pin" aria-hidden="true"><span class="pulse"></span><svg width="26" height="34" viewBox="0 0 26 34"><path d="M13 1C6.4 1 1 6.3 1 12.8C1 21.5 13 33 13 33S25 21.5 25 12.8C25 6.3 19.6 1 13 1Z" fill="url(#gGold)"/><circle cx="13" cy="13" r="4.5" fill="#fff"/></svg></div>
        <p class="eyebrow" data-i18n="placeLabel"></p>
      </div>
      <h2 id="venue" class="font-display text-3xl sm:text-4xl leading-tight font-medium"></h2>
      <p id="address" class="text-soft"></p>
      <div class="flex flex-wrap justify-center md:justify-start gap-3 mt-2">
        <a id="gmap" class="btn-gold" href="#" target="_blank" rel="noopener" data-i18n="gmap"></a>
        <a id="ymap" class="btn-line" href="#" target="_blank" rel="noopener" data-i18n="ymap"></a>
      </div>
      <a id="calLink" class="btn-line self-center md:self-start" href="#" target="_blank" rel="noopener" data-i18n="cal"></a>
    </div>
  </section>

  <!-- Program -->
  <section class="py-12">
    <p class="eyebrow" data-i18n="progEyebrow"></p>
    <h2 class="font-display text-4xl sm:text-5xl mt-2 mb-8 font-medium" data-i18n="progTitle"></h2>
    <ol id="program" class="timeline"></ol>
  </section>

  <!-- Dress code -->

      '<li><p class="tabular-nums text-sm tracking-widest text-goldink font-medium">' + p.time + '</p>'
      + '<h3 class="font-display text-2xl sm:text-3xl font-medium leading-tight">' + p.title + '</h3>'
      + '<p class="text-soft mt-1">' + p.text + '</p></li>'
    ).join('');

    reveal('#program li', 'up', 0, 0);

    const rsvpStr = l === 'ru' ? (R.d + ' ' + MONTHS.ru[R.m - 1]) : (R.d + '-' + MONTHS.uz[R.m - 1]);
    $('rsvpText').textContent = T.rsvpText(rsvpStr);
    $('contactName').textContent = T.contactLine + X.contact;
    $('phone').textContent = CONFIG.phone;
    if (CONFIG.telegram) { $('tgLink').href = CONFIG.telegram; $('tgLink').hidden = false; }

    setMusicUI();
    tickCountdown();
    onScroll();
  }

  /* ====== События ====== */
  document.querySelectorAll('#langSwitch button').forEach((b) => {
    b.addEventListener('click', () => applyLang(b.dataset.lang));
  });

  $('copyBtn').addEventListener('click', async () => {
    const btn = $('copyBtn');
    try {
      await navigator.clipboard.writeText(CONFIG.phone);
      btn.textContent = I18N[lang].copied;
    } catch (e) {
      const r = document.createRange(); r.selectNodeContents($('phone'));
      const s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      btn.textContent = I18N[lang].selected;
    }
    setTimeout(() => { btn.textContent = I18N[lang].copy; }, 2200);
  });

  $('musicBtn').addEventListener('click', () => { if (Music.on) Music.stop(); else Music.start(); setMusicUI(); });
  document.addEventListener('visibilitychange', () => {
    if (!Music.ctx) return;
    if (document.hidden) Music.ctx.suspend(); else if (Music.on) Music.ctx.resume();
  });

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('openBtn').addEventListener('click', () => {
    Music.start(); setMusicUI();
    root.classList.remove('locked'); root.classList.add('opened');
    window.scrollTo(0, 0);
    if (reduce) { $('cover').hidden = true; return; }
    $('cover').classList.add('open');
    setTimeout(() => { $('cover').hidden = true; }, 1700);
  });

  /* ====== Анимации при прокрутке ====== */
  const canReveal = 'IntersectionObserver' in window && !reduce;
  let io = null;
  if (canReveal) {
    root.classList.add('js-reveal');
    io = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
  }
  function reveal(sel, variant, base, step) {
    document.querySelectorAll(sel).forEach((el, i) => {
      if (el.dataset.rv) return;
      el.dataset.rv = '1';
      if (!io) { el.classList.add('in'); return; }
      el.classList.add('rv', 'rv-' + variant);
      el.style.setProperty('--rd', ((base || 0) + i * (step || 0)).toFixed(2) + 's');
      io.observe(el);
    });
  }
  reveal('.ornament', 'zoom');
  reveal('#invite', 'up', 0.1);
  reveal('#blessMoon', 'zoom');
  reveal('[data-i18n="blessing"]', 'up', 0.15);
  reveal('#dateCol > *', 'left', 0, 0.12);
  reveal('#placeCard', 'right', 0.1);
  reveal('[data-i18n="progEyebrow"]', 'up');
  reveal('[data-i18n="progTitle"]', 'up', 0.1);
  reveal('#dressCard', 'zoom');
  reveal('#dressCard .swatch', 'zoom', 0.25, 0.15);
  reveal('#rsvp > *', 'up', 0, 0.1);
  reveal('footer > *', 'up', 0, 0.15);

  const progressEl = $('progress'), heroMoon = $('heroMoon'), blessMoon = $('blessMoon'), prog = $('program');
  let ticking = false;
  function onScroll() {
    const y = window.scrollY || window.pageYOffset || 0;
    const max = Math.max(1, root.scrollHeight - window.innerHeight);
    progressEl.style.transform = 'scaleX(' + Math.min(1, y / max).toFixed(4) + ')';
    if (!reduce) {
      heroMoon.style.setProperty('--py', (y * 0.22).toFixed(1) + 'px');
      const r = blessMoon.getBoundingClientRect();
      blessMoon.style.setProperty('--py', ((r.top + r.height / 2 - window.innerHeight / 2) * -0.12).toFixed(1) + 'px');
    }
    const pr = prog.getBoundingClientRect();
    const p = reduce ? 1 : Math.max(0, Math.min(1, (window.innerHeight * 0.7 - pr.top) / Math.max(1, pr.height)));
    prog.style.setProperty('--p', (p * 100).toFixed(1) + '%');
    ticking = false;
  }
  window.addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(onScroll); } }, { passive: true });
  window.addEventListener('resize', onScroll);

  if (!reduce) {
    const box = $('sparks');
    for (let i = 0; i < 24; i++) {
      const sp = document.createElement('i');
      const size = 3 + Math.random() * 6;
      sp.className = 'spark';
      sp.style.cssText = 'left:' + (Math.random() * 100).toFixed(1) + '%;width:' + size.toFixed(1) + 'px;height:' + size.toFixed(1)
        + 'px;--dx:' + Math.round(Math.random() * 80 - 40) + 'px;animation-duration:' + (16 + Math.random() * 18).toFixed(1)
        + 's;animation-delay:-' + (Math.random() * 30).toFixed(1) + 's';
      box.appendChild(sp);
    }
  }

  reveal('#info > *', 'up', 0, 0.1);
  reveal('#info .gborder', 'up', 0.1, 0.15);

  /* ====== Эквалайзер на кнопке музыки: столбики двигаются под звук ====== */
  const eqBars = Array.prototype.slice.call(document.querySelectorAll('#musicBtn .eq i'));
  const EQ_EDGES = [1, 3, 8, 26];   // низкие, средние, высокие частоты
  const EQ_WOBBLE = [2.3, 3.7, 5.1];
  const eqState = [{ lo: 255, hi: 0 }, { lo: 255, hi: 0 }, { lo: 255, hi: 0 }];
  let eqRaf = 0, eqData = null, eqOffAt = 0;
  function eqFrame() {
    if (!Music.an || reduce) { eqRaf = 0; eqBars.forEach((b) => { b.style.height = ''; }); return; }
    if (!eqData) eqData = new Uint8Array(Music.an.frequencyBinCount);
    Music.an.getByteFrequencyData(eqData);
    const now = performance.now();
    if (Music.on) eqOffAt = 0; else if (!eqOffAt) eqOffAt = now;
    const fade = eqOffAt ? Math.max(0, 1 - (now - eqOffAt) / 500) : 1;
    eqBars.forEach((bar, i) => {
      const from = EQ_EDGES[i], to = EQ_EDGES[i + 1];
      let sum = 0;
      for (let k = from; k < to; k++) sum += eqData[k];
      const avg = sum / (to - from);
      // каждый столбик следит за своей полосой и подстраивается под её громкость,
      // поэтому один может быть внизу, пока другой наверху
      const st = eqState[i];
      st.hi = Math.max(avg, st.hi - 0.25);
      st.lo = Math.min(avg, st.lo + 0.25);
      let v = Math.pow(Math.max(0, Math.min(1, (avg - st.lo) / (st.hi - st.lo + 8))), 1.2);
      v = 0.8 * v + 0.2 * (0.5 + 0.5 * Math.sin(now / 1000 * EQ_WOBBLE[i] + i * 2));
      bar.style.height = (3 + v * fade * 15).toFixed(1) + 'px';
    });
    if (eqOffAt && fade <= 0) { eqRaf = 0; eqOffAt = 0; eqBars.forEach((b) => { b.style.height = ''; }); return; }
    eqRaf = requestAnimationFrame(eqFrame);
  }
  function startEq() { if (!eqRaf && !reduce && Music.an) eqRaf = requestAnimationFrame(eqFrame); }
  $('musicBtn').addEventListener('click', () => { if (!Music.on) setTimeout(startEq, 0); else startEq(); });

  applyLang(lang);
  cdTimer = setInterval(tickCountdown, 1000);
</script>
</body>
</html>
