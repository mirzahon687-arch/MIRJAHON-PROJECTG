  try { answer = JSON.parse(store.get('mc_rsvp') || 'null'); } catch (e) { answer = null; }

  const fill = (s, o) => s.replace(/\{(\w+)\}/g, (m, k) => (o[k] != null ? o[k] : m));
  const validName = () => /\p{L}{2,}/u.test($('guest').value.trim());

  function render() {
    const [a, b] = CONFIG.names[lang];
    $('nA').textContent = a; $('nB').textContent = b;
    $('mono').textContent = a[0] + ' & ' + b[0]; $('stNames').textContent = a + ' & ' + b; $('sign').textContent = a + ' & ' + b;
    const p = tzParts(when); const wd = new Date(Date.UTC(p.y, p.m - 1, p.d)).getUTCDay();
    $('dateBig').textContent = pad(p.d) + ' · ' + pad(p.m) + ' · ' + p.y;
    $('dateSub').textContent = DAYS[lang][wd] + ' · ' + hhmm(when);
    $('dateLine').textContent = p.d + ' ' + MONTHS[lang][p.m - 1] + ' ' + p.y;
    $('timeLine').textContent = DAYS[lang][wd] + ', ' + hhmm(when);
    $('venue').textContent = CONFIG.venue[lang]; $('addr').textContent = CONFIG.address[lang];
    $('phone').textContent = CONFIG.phone; $('callBtn').href = 'tel:' + CONFIG.phone.replace(/[^+\d]/g, '');
    const q = encodeURIComponent(CONFIG.venue.ru + ', ' + CONFIG.address.ru);
    $('mapG').href = 'https://www.google.com/maps/search/?api=1&query=' + q;
    $('mapY').href = 'https://yandex.com/maps/?text=' + q;
    const f = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
    $('calAdd').href = 'https://calendar.google.com/calendar/render?action=TEMPLATE&text=' + encodeURIComponent(a + ' & ' + b) + '&dates=' + f(when) + '/' + f(new Date(when.getTime() + 5 * 3600e3)) + '&location=' + q;
    document.querySelectorAll('[data-i18n]').forEach((n) => { const v = T[lang][n.dataset.i18n]; if (typeof v === 'string') n.textContent = v; });
    document.querySelectorAll('[data-i18n-ph]').forEach((n) => { n.placeholder = T[lang][n.dataset.i18nPh]; });
    document.querySelectorAll('[data-lang]').forEach((x) => x.setAttribute('aria-pressed', x.dataset.lang === lang));
    root.lang = lang;
    const prog = $('prog'); prog.textContent = '';
    T[lang].prog.forEach((name, i) => {
      const li = document.createElement('li'); const d = document.createElement('div');
      const t = document.createElement('time'); t.textContent = hhmm(new Date(when.getTime() + CONFIG.program[i] * 60000));
      const s = document.createElement('span'); s.textContent = name; d.append(t, s); li.appendChild(d); prog.appendChild(li);
      if (io) { li.classList.add('rv'); li.style.setProperty('--d', (i * .1) + 's'); io.observe(li); }
    });
    renderRsvp(); tick();
  }
  function tick() {
    const ms = when - Date.now();
    if (ms <= 0) { $('count').hidden = true; $('countDone').hidden = false; $('countDone').textContent = tr('countDone'); return; }
    $('count').hidden = false; $('countDone').hidden = true;
    const s = Math.floor(ms / 1000);
    $('cd').textContent = Math.floor(s / 86400); $('ch').textContent = pad(Math.floor(s % 86400 / 3600)); $('cm').textContent = pad(Math.floor(s % 3600 / 60)); $('cs').textContent = pad(s % 60);
  }
  setInterval(tick, 1000);

  /* ====== Подтверждение (имя + галочка / крестик) ====== */
  const CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12.5l5 5L19.5 7"/></svg>';
  const CROSS = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  function setReady() {
    const ok = validName();
    ['yes', 'no'].forEach((id) => $(id).setAttribute('aria-disabled', ok ? 'false' : 'true'));
    if (ok) { $('guest').removeAttribute('aria-invalid'); $('rsvpMsg').textContent = ''; }
  }
  function renderRsvp() {
    const done = !!(answer && answer.name && (answer.v === 'yes' || answer.v === 'no'));
    $('rsvpForm').hidden = done; $('rsvpDone').hidden = !done;
    if (!done) { setReady(); return; }
    const yes = answer.v === 'yes', [a, b] = CONFIG.names[lang];
    $('doneTick').innerHTML = yes ? CHECK : CROSS; $('doneTick').className = 'tick' + (yes ? '' : ' no');
    $('doneTitle').textContent = fill(tr(yes ? 'doneYes' : 'doneNo'), { n: answer.name });
    $('doneText').textContent = tr(yes ? 'doneYesT' : 'doneNoT');
    const text = fill(tr(yes ? 'msgYes' : 'msgNo'), { n: answer.name, a, b });
    const wa = $('sendWa'); wa.hidden = !CONFIG.whatsapp; if (CONFIG.whatsapp) wa.href = 'https://wa.me/' + CONFIG.whatsapp.replace(/\D/g, '') + '?text=' + encodeURIComponent(text);
    const tg = $('sendTg'); tg.hidden = !(CONFIG.telegram || CONFIG.tgPhone);
    if (CONFIG.telegram) tg.href = 'https://t.me/' + CONFIG.telegram.replace(/^@/, '') + '?text=' + encodeURIComponent(text);
    else if (CONFIG.tgPhone) tg.href = 'tg://resolve?phone=' + CONFIG.tgPhone.replace(/\D/g, '') + '&text=' + encodeURIComponent(text);
  }
  let busy = false;
  async function answerWith(v) {
    if (busy) return;
    if (!validName()) {
      const g = $('guest'); g.setAttribute('aria-invalid', 'true'); $('rsvpMsg').textContent = tr('needName');
      g.focus(); return;
    }
    const name = $('guest').value.trim().replace(/\s+/g, ' ');
    busy = true; $('rsvpMsg').style.color = 'var(--ink)'; $('rsvpMsg').textContent = tr('sending');
    try {
      const body = new URLSearchParams({ 'form-name': 'rsvp', name, answer: v === 'yes' ? 'ПРИДЁТ ✓' : 'НЕ ПРИДЁТ ✗', lang });
      const r = await fetch('/', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: body.toString() });
      if (!r.ok) throw new Error('http ' + r.status);
      answer = { name, v }; store.set('mc_rsvp', JSON.stringify(answer)); $('rsvpMsg').textContent = ''; renderRsvp();
    } catch (e) { $('rsvpMsg').style.color = ''; $('rsvpMsg').textContent = tr('sendFail'); }
    busy = false;
  }
  $('guest').addEventListener('input', setReady);
  $('guest').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); if (validName()) $('yes').focus(); else answerWith('yes'); } });
  $('yes').addEventListener('click', () => answerWith('yes'));
  $('no').addEventListener('click', () => answerWith('no'));
  $('redo').addEventListener('click', () => { const n = answer && answer.name; answer = null; store.del('mc_rsvp'); renderRsvp(); $('guest').value = n || ''; setReady(); $('guest').focus(); });

  /* ====== Появление при прокрутке ====== */
  if ('IntersectionObserver' in window && !reduce) {
    root.classList.add('js');
    io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
  }

  /* ====== Лепестки ====== */
  if (!reduce) {
    const box = $('petals');
    for (let i = 0; i < 7; i++) {
      const p = document.createElement('i');
      p.style.cssText = '--x:' + ((i * 8.3 + 4) % 100) + '%;--s:' + (8 + (i % 4) * 3) + 'px;--t:' + (13 + (i % 5) * 3) + 's;--dl:' + (-i * 2.3) + 's;--dx:' + ((i % 2 ? 1 : -1) * (30 + i * 6)) + 'px;--r:' + ((i % 2 ? 1 : -1) * 540) + 'deg';
      box.appendChild(p);
    }
  }

  /* ====== Музыка: нежное пианино, струнный фон и мелодия ====== */
  const Music = (() => {
    let ctx, master, wet, tone, timer, step = 0, nextT = 0, on = false;
    const BEAT = 60 / 66, S = BEAT / 2;
    const hz = (m) => 440 * Math.pow(2, (m - 69) / 12);
    const CH = { C: [36, 48, 55, 60, 64, 67], G: [31, 43, 50, 55, 59, 62], Am: [33, 45, 52, 57, 60, 64], F: [29, 41, 48, 53, 57, 60] };
    const PROG = ['C', 'G', 'Am', 'F', 'C', 'G', 'F', 'G'];
    const ARP = [2, 3, 4, 5, 4, 3, 5, 4];
    const MEL = [
      [[0, 79, 3], [3, 77, 1], [4, 76, 4]], [[0, 74, 3], [3, 76, 1], [4, 77, 2], [6, 74, 2]],
      [[0, 72, 3], [3, 76, 1], [4, 81, 4]], [[0, 79, 3], [3, 77, 1], [4, 76, 2], [6, 77, 2]],
      [[0, 79, 2], [2, 84, 2], [4, 83, 2], [6, 79, 2]], [[0, 81, 3], [3, 79, 1], [4, 77, 4]],
      [[0, 76, 2], [2, 77, 2], [4, 79, 2], [6, 81, 2]], [[0, 83, 3], [3, 79, 1], [4, 74, 4]]
    ];
    const ir = () => { const n = ctx.sampleRate * 1.8, b = ctx.createBuffer(2, n, ctx.sampleRate); for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); let lp = 0; for (let i = 0; i < n; i++) { lp += ((Math.random() * 2 - 1) - lp) * .35; d[i] = lp * Math.pow(1 - i / n, 2.4); } } return b; };
    function key(m, t, dur, vol, soft) {
      const f = hz(m), g = ctx.createGain(), lp = ctx.createBiquadFilter();
      lp.type = 'lowpass'; lp.frequency.setValueAtTime(Math.min(6000, f * (soft ? 5 : 9)), t); lp.frequency.exponentialRampToValueAtTime(Math.max(500, f * 1.8), t + dur);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(vol * .4, t + 0.35); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      lp.connect(g); g.connect(master); g.connect(wet);
      [[1, 1, 0], [2, .42, 3], [3, .2, -2], [4, .1, 2], [5, .05, 0]].forEach(([k, a, dt]) => {
        const o = ctx.createOscillator(), og = ctx.createGain(); o.type = 'sine'; o.frequency.value = f * k; o.detune.value = dt; og.gain.value = a; o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + .05);
      });
    }
    function strings(notes, t, dur) {
      notes.forEach((m) => {
        [-7, 7].forEach((dt) => {
          const o = ctx.createOscillator(), g = ctx.createGain(), lp = ctx.createBiquadFilter();
          o.type = 'sawtooth'; o.frequency.value = hz(m); o.detune.value = dt; lp.type = 'lowpass'; lp.frequency.value = 800; lp.Q.value = .5;
          g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.011, t + 1.3); g.gain.linearRampToValueAtTime(0.009, t + dur - .8); g.gain.linearRampToValueAtTime(0.0001, t + dur + .6);
          o.connect(lp); lp.connect(g); g.connect(master); g.connect(wet); o.start(t); o.stop(t + dur + .7);
        });
      });
    }
    function schedule() {
      while (nextT < ctx.currentTime + 0.7) {
        const bar = Math.floor(step / 8) % 8, i = step % 8, ch = CH[PROG[bar]];
        if (i === 0) { key(ch[0], nextT, BEAT * 4, 0.16, true); key(ch[1], nextT, BEAT * 3.5, 0.1, true); strings(ch.slice(2, 5), nextT, BEAT * 4); }
        key(ch[ARP[i]], nextT + (Math.random() * .012), BEAT * 1.6, 0.055 + (i % 4 === 0 ? .02 : 0), true);
        MEL[bar].forEach(([s, m, l]) => { if (s === i) key(m, nextT, l * S * 1.15 + .9, 0.12, false); });
        nextT += S; step++;
      }
    }
    return {
      start() {
        if (on) return; try {
          ctx = ctx || new (window.AudioContext || window.webkitAudioContext)(); if (ctx.state === 'suspended') ctx.resume();
          if (!master) {
            master = ctx.createGain(); const comp = ctx.createDynamicsCompressor(); const conv = ctx.createConvolver(); conv.buffer = ir();
            wet = ctx.createGain(); wet.gain.value = 0.5; tone = ctx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 5200;
            wet.connect(conv); conv.connect(tone); master.connect(tone); tone.connect(comp); comp.connect(ctx.destination);
          }
          master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(0.0001, ctx.currentTime); master.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 2.5);
          nextT = ctx.currentTime + 0.1; on = true; schedule(); timer = setInterval(schedule, 150);
        } catch (e) { on = false; }
      },
      stop() { if (!on) return; on = false; clearInterval(timer); try { master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setValueAtTime(master.gain.value, ctx.currentTime); master.gain.linearRampToValueAtTime(0.0001, ctx.currentTime + .6); } catch (e) {} },
      get on() { return on; }
    };
  })();
  const mBtn = $('music');
  const setMusicUI = () => mBtn.setAttribute('aria-pressed', Music.on);
  mBtn.addEventListener('click', () => { if (Music.on) Music.stop(); else Music.start(); setMusicUI(); });

  /* ====== Конверт ====== */
  root.classList.add('locked');
  let opened = false;
  (function sparkles() {
    if (reduce) return; const box = $('env'); const P = [[22, 30], [76, 26], [38, 58], [66, 62], [14, 52], [86, 48], [50, 18], [30, 78], [72, 80]];
    P.forEach((q, i) => { const s = document.createElement('i'); s.className = 'tw'; s.style.cssText = 'left:calc(' + q[0] + '% - 2.5 * var(--u));top:calc(' + q[1] + '% - 2.5 * var(--u));--t:' + (4 + (i % 4)) + 's;--dl:' + (-i * 1.3) + 's'; box.appendChild(s); });
  })();
  (function dust() {
    if (reduce) return; const box = $('dust');
    for (let i = 0; i < 12; i++) { const p = document.createElement('i'); p.style.cssText = '--x:' + ((i * 6.7 + 5) % 100) + '%;--s:' + (3 + (i % 4) * 2) + 'px;--t:' + (11 + (i % 5) * 3) + 's;--dl:' + (-i * 1.7) + 's;--dx:' + ((i % 2 ? 1 : -1) * (14 + i * 3)) + 'px'; box.appendChild(p); }
  })();
  function openEnvelope() {
    if (opened) return; opened = true;
    mBtn.classList.add('show'); Music.start(); setMusicUI();
    $('env').classList.add('open');
    if (!reduce) {
      const st = $('stage'), r = st.getBoundingClientRect(), sr0 = $('seal').getBoundingClientRect(), cx = sr0.left + sr0.width / 2 - r.left, cy = sr0.top + sr0.height / 2 - r.top;
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('i'); p.className = 'pearl'; const s = 4 + Math.random() * 5; p.style.cssText = 'left:' + cx + 'px;top:' + cy + 'px;width:' + s + 'px;height:' + s + 'px'; st.appendChild(p);
        const a = Math.random() * 6.283, d = 70 + Math.random() * 200;
        p.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: 'translate(' + Math.cos(a) * d + 'px,' + (Math.sin(a) * d + 60) + 'px) scale(.6)', opacity: 0 }], { duration: 600 + Math.random() * 400, easing: 'cubic-bezier(.2,.7,.3,1)', delay: Math.random() * 250, fill: 'forwards' }).onfinish = () => p.remove();
      }
    }
    const done = () => {
      root.classList.remove('locked'); window.scrollTo(0, 0);
      document.querySelectorAll('.rv:not(li)').forEach((el) => { if (io) io.observe(el); });
      $('stage').classList.add('leave'); setTimeout(() => { $('stage').hidden = true; }, 650);
    };
    if (reduce) { done(); return; }
    setTimeout(done, 1000);
  }

  $('seal').addEventListener('click', (e) => { e.stopPropagation(); openEnvelope(); });
  $('env').addEventListener('click', openEnvelope);
  document.querySelectorAll('[data-lang]').forEach((b) => b.addEventListener('click', () => { lang = b.dataset.lang; store.set('mc_lang', lang); render(); }));
  render();

  /* ====== Лента из прямых линий: V от верхних углов к печати ====== */
  (function () {
    const NS = 'http://www.w3.org/2000/svg', INK = '#BFB098';
    function build() {
      const st = $('env'), el = $('scal'), lace = document.querySelector('.lace'), ff = document.querySelector('.ff'), liner = document.querySelector('.liner'); if (!st || !el) return;
      const W = st.clientWidth, H = st.clientHeight; if (!W || !H) return;
      el.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
      const U = Math.min(W, H * .62), y0 = H * .18, y1 = H * .475, up = -1, bw = Math.max(18, U * .06);
      const f1 = (v) => v.toFixed(1);
      while (el.firstChild) el.removeChild(el.firstChild);
      const line = (o, sw, col, op) => { const e = document.createElementNS(NS, 'path'); e.setAttribute('d', 'M0,' + f1(y0 + o) + ' L' + f1(W / 2) + ',' + f1(y1 + o) + ' L' + W + ',' + f1(y0 + o)); e.setAttribute('fill', 'none'); e.setAttribute('stroke', col); e.setAttribute('stroke-width', sw); e.setAttribute('stroke-opacity', op); e.setAttribute('stroke-linejoin', 'miter'); el.appendChild(e); };
      line(up, 1.1, INK, 1); line(bw, 1.1, INK, 1); line(bw * .5, .7, INK, .55);
      const d = 'M0,' + f1(y0 + up) + ' L' + f1(W / 2) + ',' + f1(y1 + up) + ' L' + W + ',' + f1(y0 + up) + ' L' + W + ',' + f1(y0 + bw) + ' L' + f1(W / 2) + ',' + f1(y1 + bw) + ' L0,' + f1(y0 + bw) + ' Z';
      const sh = $('lsh'); sh.setAttribute('viewBox', '0 0 ' + W + ' ' + H); sh.innerHTML = '<path d="' + d + '"/>'; lace.style.clipPath = "path('" + d + "')";
      const fl = 'M0,0 L' + W + ',0 L' + W + ',' + f1(y0 + bw * .5) + ' L' + f1(W / 2) + ',' + f1(y1 + bw * .5) + ' L0,' + f1(y0 + bw * .5) + ' Z';
      const fr = document.querySelector('.front');
      if (fr) {
        fr.setAttribute('viewBox', '0 0 ' + W + ' ' + H); fr.setAttribute('preserveAspectRatio', 'none');
        const cx = W / 2, yp = H * .68, yb = H + 30, vo = Math.max(5, bw * .3);
        const sdy = Math.min(W / 2 * 1.1, H * .3), sl0 = sdy / cx, sh = U * .24, xe = W + 30;
        const yeL = y1 + sl0 * (cx - sh + 30), yeR = y1 + sl0 * (cx - sh + 30);
        const xs = (y1 - y0 - bw * .5 + sl0 * (cx - sh)) / ((y1 - y0) / cx + sl0), ysL = y1 + sl0 * (cx - sh - xs);
        const sdL = (o) => 'M' + f1(xs) + ',' + f1(ysL + o) + ' L-30,' + f1(yeL + o);
        const sdR = (o) => 'M' + f1(W - xs) + ',' + f1(ysL + o) + ' L' + xe + ',' + f1(yeR + o);
        const sd = (o) => sdL(o) + ' ' + sdR(o);
        const sband = sdL(-vo) + ' L-30,' + f1(yeL + vo) + ' L' + f1(xs) + ',' + f1(ysL + vo) + ' Z ' + sdR(-vo) + ' L' + xe + ',' + f1(yeR + vo) + ' L' + f1(W - xs) + ',' + f1(ysL + vo) + ' Z';
        const chev = (o) => 'M-30,' + f1(yb + o) + ' L' + f1(cx) + ',' + f1(yp + o) + ' L' + (W + 30) + ',' + f1(yb + o);
        const dd = sband;
        let h = '<defs><filter id="fsh" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.5"/></filter><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FDFAF3"/><stop offset="1" stop-color="#F8F3E8"/></linearGradient></defs>';
        h += '<path d="' + dd + '" fill="#5a4129" opacity=".45" filter="url(#fsh)" transform="translate(0,3)"/>';
        h += '<path d="' + dd + '" fill="url(#fg)"/>';
        [[-vo, .8, 1], [vo, .8, 1], [0, .5, .5]].forEach((p) => { h += '<path d="' + sd(p[0]) + '" fill="none" stroke="' + INK + '" stroke-width="' + p[1] + '" stroke-opacity="' + p[2] + '"/>'; });
        fr.innerHTML = h;
      }
      ff.style.clipPath = "path('" + fl + "')"; liner.style.clipPath = "path('" + fl + "')";
    }
    build(); window.addEventListener('resize', build);
  })();
})();
</script>
